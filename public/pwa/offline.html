<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1a1a" />
    <title>Sin conexión · Zontes</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f8f3;
        color: #1a1a1a;
        font:
          16px system-ui,
          sans-serif;
      }
      main {
        max-width: 26rem;
        padding: 2rem;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 1rem;
      }
      p {
        line-height: 1.6;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.85rem 1.5rem;
        border: 1px solid #1a1a1a;
        border-radius: 0.75rem;
        background: #dcfc36;
        color: #1a1a1a;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #1a1a1a;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192.png" alt="Zontes" width="72" height="72" />
      <h1>Sin conexión</h1>
      <p>
        Conéctate a internet para acceder a tus puntos, beneficios y novedades.
      </p>
      <a href="/ingresar">Volver a intentar</a>
    </main>
  </body>
</html>
